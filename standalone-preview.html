    /* ==========================================================================
       CropGuard AI - Global Design System
       Colors: Forest Green, Sage Green, White, Soft Cream

    :root {

      --color-forest-primary: #1B4332;
      --color-forest-light: #2D6A4F;

      --color-sage-bg: #E8F5E9;
      --color-sage-tint: #F0F7F4;

      --color-cream-bg: #FBFBF7;
      --color-cream-surface: #F6F8F3;
      --color-cream-card: #FAF9F5;
      --color-white: #FFFFFF;

      --color-text-main: #1C2D27;
      --color-text-secondary: #4B6358;
      --color-text-muted: #6C8276;
      --color-border: #E0EADE;

      --radius-xl: 28px;

    .card:hover { box-shadow: var(--shadow-md); border-color: var(--color-border-hover); }
    .card-cream { background-color: var(--color-cream-card); }

      border-radius: var(--radius-full); transition: all 0.2s;

    .btn-primary {
      background-color: var(--color-forest-primary); color: #FFF;

    }
    .btn-primary:hover { background-color: var(--color-forest-hover); transform: translateY(-1px); }
    .btn-secondary {

    .nav-link {

    .mobile-menu-toggle { display: none; background: none; }

      .mobile-menu-toggle { display: block; }

        display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0;
        background: var(--color-cream-bg); border-bottom: 1px solid var(--color-border);
        padding: 1rem 1.5rem; gap: 0.5rem; box-shadow: var(--shadow-md);
      }

    .hero-tagline { font-size: 1.35rem; color: var(--color-sage-primary); margin-bottom: 1.25rem; font-weight: 700; }
    .hero-intro { font-size: 1.05rem; color: var(--color-text-secondary); line-height: 1.7; margin-bottom: 2rem; }
    .hero-preview-card {

      border: 1px solid var(--color-border-hover); border-radius: var(--radius-xl);
      padding: 2rem; box-shadow: var(--shadow-lg);
    }

    /* Features Grid */
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
    .feature-card { background: #FFF; border-radius: var(--radius-lg); border: 1px solid var(--color-border); padding: 1.75rem; }
    .feature-icon-box {
      width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-sage-bg);
      color: var(--color-forest-primary); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;
    }

    /* Forms */
    .form-group { margin-bottom: 1.6rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.4rem; }
    .form-sublabel { font-size: 0.825rem; color: var(--color-text-muted); margin-bottom: 0.5rem; display: block; }
    .form-select, .form-input {
      width: 100%; padding: 0.85rem 1.1rem; font-size: 0.95rem;
      border: 1.5px solid var(--color-border); border-radius: var(--radius-md); background: #FFF; outline: none;

    .form-select:focus, .form-input:focus { border-color: var(--color-forest-light); }
    .dropzone {
      border: 2px dashed var(--color-sage-soft); background: var(--color-cream-card);
      border-radius: var(--radius-lg); padding: 2.25rem 1.5rem; text-align: center; cursor: pointer;
    }
    .dropzone:hover { background: var(--color-sage-tint); border-color: var(--color-forest-light); }

    .preview-box { border-radius: var(--radius-md); overflow: hidden; background: #000; max-height: 260px; display: flex; align-items: center; justify-content: center; }
    .preview-box img { width: 100%; height: 240px; object-fit: cover; }
    .preview-actions { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #FFF; border: 1px solid var(--color-border); border-radius: 0 0 var(--radius-md) var(--radius-md); }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin: 1.5rem 0; }
    .metric-card { background: #FFF; border-radius: var(--radius-lg); border: 1px solid var(--color-border); padding: 1.35rem 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .metric-value { font-size: 1.6rem; font-weight: 800; color: var(--color-forest-dark); }
    .metric-label { font-size: 0.825rem; color: var(--color-text-muted); }

    .recommendations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-top: 1rem; }
    .rec-card { background: #FFF; border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 1.35rem; display: flex; gap: 0.9rem; }
    .rec-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--color-sage-bg); color: var(--color-forest-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .footer { background: var(--color-forest-dark); color: #D8E2DC; padding: 3rem 1.5rem 1.5rem; margin-top: auto; border-top: 3px solid var(--color-sage-primary); }
    .footer-container { max-width: var(--max-width); margin: 0 auto; }

    .switcher-pill {
      font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.85rem; border-radius: var(--radius-full);
      background-color: var(--color-white); border: 1px solid var(--color-border); color: var(--color-forest-dark);
      cursor: pointer;
    }
    .switcher-pill.active {
      background-color: var(--color-forest-primary); color: #FFF; border-color: var(--color-forest-primary);
    }
  </style>
</head>

                      <img src={DEMO_LEAF} alt="Preview" />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                      <div className="card" style={{ padding: '0.75rem' }}>
                        <span style={{ fontSize: '0.75rem', color: '#666' }}>Humidity</span>
                        <div style={{ fontWeight: 800, color: '#991B1B' }}>92% RH</div>
                      </div>
                      <div className="card" style={{ padding: '0.75rem' }}>
                        <span style={{ fontSize: '0.75rem', color: '#666' }}>Canopy Temp</span>
                        <div style={{ fontWeight: 800 }}>18.5°C</div>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {page === 'analysis' && (
              <div className="page-wrapper">
                <h1 style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>Crop Diagnostic Analysis</h1>
                <p style={{ color: 'var(--color-text-secondary)', marginBottom: '2rem' }}>Upload your leaf photo, select crop and farm location to generate micro-climatic warnings.</p>

                <div className="card" style={{ maxWidth: '680px', margin: '0 auto' }}>
                  <form onSubmit={handleAnalyze}>
                    {Object.keys(errors).length > 0 && (
                      <div style={{ background: '#FEE2E2', color: '#991B1B', padding: '0.75rem', borderRadius: '8px', marginBottom: '1rem' }}>
                        Please complete all required fields.
                      </div>
                    )}

                    <div className="form-group">
                      <label className="form-label">1. Select Crop *</label>
                      <select className="form-select" value={crop} onChange={(e) => setCrop(e.target.value)}>
                        <option value="">-- Choose Crop --</option>
                        <option value="Tomato">🍅 Tomato (Solanum lycopersicum)</option>
                        <option value="Potato">🥔 Potato (Solanum tuberosum)</option>
                      </select>
                      {errors.crop && <span style={{ color: '#DC2626', fontSize: '0.8rem' }}>{errors.crop}</span>}
                    </div>

                    <div className="form-group">
                      <label className="form-label">2. Upload Leaf Photo *</label>
                      <input 
                        type="file" 
                        ref={fileInputRef} 
                        style={{ display: 'none' }} 
                        accept="image/*"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => setImagePreview(ev.target.result);
                            reader.readAsDataURL(file);
                          }
                        }}
                      />

                      {!imagePreview ? (
                        <div className="dropzone" onClick={() => fileInputRef.current?.click()}>
                          <LeafIcon size={32} />
                          <div style={{ fontWeight: 700, margin: '0.5rem 0' }}>Click to select leaf photo</div>
                          <span style={{ fontSize: '0.8rem', color: '#777' }}>PNG, JPG, WebP</span>
                        </div>
                      ) : (
                        <div>
                          <div className="preview-box">
                            <img src={imagePreview} alt="Leaf Preview" />
                          </div>
                          <div className="preview-actions">
                            <span style={{ fontSize: '0.85rem', fontWeight: 600 }}>Leaf Photo Loaded</span>
                            <button type="button" className="btn btn-outline" style={{ padding: '0.25rem 0.6rem' }} onClick={() => setImagePreview(null)}>Remove</button>
                          </div>
                        </div>
                      )}

                      <div style={{ marginTop: '0.75rem', padding: '0.75rem', background: '#F4F6F0', borderRadius: '8px' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700 }}>Or test with a sample:</span>
                        <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.4rem' }}>
                          <button type="button" className="btn btn-outline" style={{ fontSize: '0.75rem', padding: '0.3rem 0.6rem' }} onClick={() => { setImagePreview(DEMO_LEAF); setCrop('Tomato'); setLocation('Nashik Valley, MH'); }}>Sample Tomato</button>
                          <button type="button" className="btn btn-outline" style={{ fontSize: '0.75rem', padding: '0.3rem 0.6rem' }} onClick={() => { setImagePreview(DEMO_LEAF); setCrop('Potato'); setLocation('Punjab North Farm'); }}>Sample Potato</button>
                        </div>
                      </div>
                      {errors.image && <span style={{ color: '#DC2626', fontSize: '0.8rem' }}>{errors.image}</span>}
                    </div>

                    <div className="form-group">
                      <label className="form-label">3. Location *</label>
                      <input 
                        type="text" 
                        className="form-input" 
                        placeholder="e.g. Nashik Valley, Maharashtra" 
                        value={location} 
                        onChange={(e) => setLocation(e.target.value)} 
                      />
                      {errors.location && <span style={{ color: '#DC2626', fontSize: '0.8rem' }}>{errors.location}</span>}
                    </div>

                    <button type="submit" className="btn btn-primary btn-lg" style={{ width: '100%' }}>
                      Analyse Crop
                    </button>
                  </form>
                </div>
              </div>
            )}

            {page === 'results' && (
              <div className="page-wrapper">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', flexWrap: 'wrap', gap: '1rem' }}>
                  <div>
                    <span className="badge badge-demo">Simulated Demo Data</span>
                    <h1 style={{ fontSize: '2rem', marginTop: '0.5rem' }}>Results Dashboard</h1>
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem' }}>
                    <button className="btn btn-outline" onClick={() => window.print()}>Print / Save PDF</button>
                    <button className="btn btn-secondary" onClick={() => setPage('analysis')}>Analyze Another Crop</button>
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '320px 1fr', gap: '1.5rem', marginBottom: '2rem' }}>
                  <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                    <div className="preview-box">
                      <img src={imagePreview || DEMO_LEAF} alt="Analyzed Crop" />
                    </div>
                    <div style={{ padding: '1rem', fontSize: '0.85rem' }}>
                      <div><strong>Crop:</strong> {result.crop || crop || 'Tomato'}</div>
                      <div><strong>Location:</strong> {location || 'Nashik Valley, MH'}</div>
                    </div>
                  </div>

                  <div className="card">
                    <span style={{ fontSize: '0.8rem', color: '#777', textTransform: 'uppercase' }}>Identified Disease</span>
                    <h2 style={{ fontSize: '1.8rem', margin: '0.25rem 0' }}>{result.disease}</h2>
                    <div style={{ fontStyle: 'italic', color: '#666', marginBottom: '1rem' }}>{result.scientific}</div>

                    <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', marginBottom: '1rem' }}>
                      <span className="badge" style={{ 
                        background: result.risk === 'High' ? '#FEE2E2' : result.risk === 'Moderate' ? '#FEF3C7' : '#D1FAE5', 
                        color: result.risk === 'High' ? '#991B1B' : result.risk === 'Moderate' ? '#92400E' : '#065F46', 
                        padding: '0.4rem 0.8rem', 
                        fontSize: '0.85rem' 
                      }}>
                        {result.risk} Risk ({result.score}/100)
                      </span>
                      <span>Confidence: <strong>{result.confidence}%</strong></span>
                    </div>

                    <div style={{ 
                      background: result.risk === 'High' ? '#FEE2E2' : result.risk === 'Moderate' ? '#FEF3C7' : '#D1FAE5', 
                      color: result.risk === 'High' ? '#991B1B' : result.risk === 'Moderate' ? '#92400E' : '#065F46', 
                      padding: '0.75rem 1rem', 
                      borderRadius: '8px', 
                      fontSize: '0.875rem' 
                    }}>
                      <strong>Early Warning:</strong> {result.warning}
                    </div>
                  </div>
                </div>

                <h3 style={{ marginBottom: '1rem' }}>Micro-Climatic Indicators</h3>
                <div className="metrics-grid">
                  <div className="metric-card">
                    <span className="metric-label">Temperature</span>
                    <div className="metric-value">{result.temp}</div>
                    <span style={{ fontSize: '0.75rem', color: result.risk === 'High' ? '#991B1B' : '#065F46' }}>Optimal Range Check</span>
                  </div>
                  <div className="metric-card">
                    <span className="metric-label">Relative Humidity</span>
                    <div className="metric-value">{result.humidity}</div>
                    <span style={{ fontSize: '0.75rem', color: result.risk === 'High' ? '#991B1B' : '#065F46' }}>Moisture Threshold</span>
                  </div>
                  <div className="metric-card">
                    <span className="metric-label">Rainfall Forecast</span>
                    <div className="metric-value">{result.rain}</div>
                    <span style={{ fontSize: '0.75rem', color: '#666' }}>Spore Washdown Risk</span>
                  </div>
                  <div className="metric-card">
                    <span className="metric-label">Leaf Wetness</span>
                    <div className="metric-value">{result.leafWetness}</div>
                    <span style={{ fontSize: '0.75rem', color: result.risk === 'High' ? '#991B1B' : '#065F46' }}>Smith Period Window</span>
                  </div>
                </div>

                <h3 style={{ margin: '2rem 0 1rem' }}>Preventive Recommendations</h3>
                <div className="recommendations-grid">
                  {result.recommendations.map((rec, i) => (
                    <div key={i} className="rec-card">
                      <div className="rec-icon"><CheckCircleIcon size={20}/></div>
                      <div>
                        <h4 style={{ fontSize: '0.95rem' }}>{rec.title}</h4>
                        <p style={{ fontSize: '0.85rem', color: '#555' }}>{rec.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Scenario Switcher for Judges */}
                <div style={{ marginTop: '2.5rem', padding: '1.25rem', background: '#FAF9F5', border: '1.5px dashed #B8D8C7', borderRadius: '14px' }}>
                  <div style={{ fontWeight: 700, marginBottom: '0.5rem', color: 'var(--color-forest-dark)' }}>
                    🧪 Hackathon Judge Demo Switcher:
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                    <button className={`switcher-pill ${result.id==='tomato_late'?'active':''}`} onClick={() => setResult(MOCK_RESULTS.tomato_late)}>🍅 Tomato Late Blight (High)</button>
                    <button className={`switcher-pill ${result.id==='potato_late'?'active':''}`} onClick={() => setResult(MOCK_RESULTS.potato_late)}>🥔 Potato Late Blight (High)</button>
                    <button className={`switcher-pill ${result.id==='tomato_early'?'active':''}`} onClick={() => setResult(MOCK_RESULTS.tomato_early)}>🍅 Tomato Early Blight (Moderate)</button>
                    <button className={`switcher-pill ${result.id==='healthy'?'active':''}`} onClick={() => setResult(MOCK_RESULTS.healthy)}>🌿 Healthy Foliage (Low)</button>
                  </div>
                </div>
              </div>
            )}

            {page === 'about' && (
              <div className="page-wrapper">
                <h1 style={{ fontSize: '2.2rem', marginBottom: '0.5rem', textAlign: 'center' }}>How CropGuard AI Works</h1>
                <p style={{ textAlign: 'center', color: '#666', maxWidth: '640px', margin: '0 auto 2.5rem' }}>
                  Micro-Climatic Crop Disease Early Warning System for first-year engineering hackathon.
                </p>

                <div className="features-grid">
                  <div className="feature-card">
                    <div className="feature-icon-box"><LeafIcon size={24}/></div>
                    <h3>1. Visual Foliar Detection</h3>
                    <p>Computer vision scans mobile leaf photos for early concentric lesions and water-soaked spots before spreading across the field.</p>
                  </div>
                  <div className="feature-card">
                    <div className="feature-icon-box"><ThermometerIcon size={24}/></div>
                    <h3>2. Micro-Climate Fusion</h3>
                    <p>Fungal pathogens strictly require temperatures between 15-22°C and humidity &gt;85% for 6+ hours ("Smith Period"). We track this to forecast outbreaks.</p>
                  </div>
                  <div className="feature-card">
                    <div className="feature-icon-box"><ShieldAlertIcon size={24}/></div>
                    <h3>3. Actionable Advisory</h3>
                    <p>Farmers receive preventive fungicide sprays, irrigation cuts, and airflow advice before rainstorms wash spores into soil tubers.</p>
                  </div>
                </div>

                <div className="card" style={{ maxWidth: '600px', margin: '2rem auto', textAlign: 'center' }}>
                  <span className="badge badge-sage">Team CodeNova</span>
                  <h3 style={{ margin: '0.75rem 0' }}>Built for 6-Hour Hackathon</h3>
                  <p style={{ fontSize: '0.9rem', color: '#555', marginBottom: '1.25rem' }}>
                    Micro-Climatic Crop Disease Early Warning System frontend built with React, Vite, and modern agricultural design.
                  </p>
                  <button className="btn btn-primary" onClick={() => setPage('analysis')}>Test Analysis</button>
                </div>
              </div>
            )}
          </main>

          <footer className="footer">
            <div className="footer-container">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
                <div>
                  <h4 style={{ color: '#FFF' }}>CropGuard AI</h4>
                  <p style={{ fontSize: '0.85rem', color: '#B7C8B5' }}>Predict Before It Spreads • Team CodeNova</p>
                </div>
                <div style={{ fontSize: '0.8rem', color: '#8DA396' }}>
                  Frontend Prototype • DEMO DATA
                </div>
              </div>
            </div>
          </footer>

          {showModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,54,39,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '1rem' }} onClick={() => setShowModal(false)}>
              <div className="card" style={{ maxWidth: '560px', width: '100%' }} onClick={(e) => e.stopPropagation()}>
                <h3 style={{ marginBottom: '1rem' }}>🛠️ Teammate Backend Integration</h3>
                <p style={{ fontSize: '0.9rem', color: '#4B6358' }}>
                  All mock scenarios are located in <code>src/data/mockResults.js</code>. When your backend teammate runs their FastAPI / Flask model, simply replace the mock simulator with:
                </p>
                <pre style={{ background: '#1E293B', color: '#E2E8F0', padding: '0.85rem', borderRadius: '8px', fontSize: '0.8rem', marginTop: '0.5rem', overflowX: 'auto' }}>
{`const res = await fetch('http://localhost:8000/api/predict', {
  method: 'POST',
  body: formData
});
return await res.json();`}
                </pre>
                <button className="btn btn-primary" style={{ marginTop: '1rem' }} onClick={() => setShowModal(false)}>Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
